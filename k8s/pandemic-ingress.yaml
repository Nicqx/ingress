# Apply ONLY after the Pandemic backend enforces invite cookies in production.
# The previous BasicAuth middleware is deliberately NOT deleted here.
# Standalone route: does not touch other applications' managed ingresses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pandemic-game-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pmqxyz.hopto.org
      secretName: my-tls-secret
  rules:
    - host: pmqxyz.hopto.org
      http:
        paths:
          - path: /pandemic
            pathType: Prefix
            backend:
              service:
                name: pandemic-service
                port:
                  number: 8111
