# Apply only after pandemic-service:8111 is Ready and the BasicAuth Secret exists.
# Standalone resource names: safe alongside Nicqx/ingress managed home-games routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pandemic-auth
  namespace: default
spec:
  basicAuth:
    secret: pandemic-basic-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pandemic-game-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-pandemic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pmqxyz.hopto.org
      secretName: my-tls-secret
  rules:
    - host: pmqxyz.hopto.org
      http:
        paths:
          - path: /pandemic
            pathType: Prefix
            backend:
              service:
                name: pandemic-service
                port:
                  number: 8111
